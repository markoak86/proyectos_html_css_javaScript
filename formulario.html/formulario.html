<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
<h1 style="color: rgb(7, 150, 12);text-align: center;"><b><u>FORMULARIO DE REGISTRO</u></b></h1>

<form style="background-color: rgb(0, 42, 255); margin-left: 300px; margin-right: 300px;">
    <label style="color: beige; font-size: 20px;">Nombre:</label>
    <br>
    <input type="text" placeholder="Escribe tu nombre">
    <br>
    <label style="color: beige; font-size: 20px;">Apellidos:</label>
    <br>
    <input type="text" placeholder="Escribe tus Apellidos">
    <br>
    <label style="color: beige; font-size: 20px;">Genero:</label>
    <br>
    <select>
        <option>masculino</option>
        <option>femenino</option>
    </select>
    <br>
    <label style="color: beige; font-size: 20px;">Fecha de nacimiento:</label><br>
    <input type="date">
    <br>
    <label style="color: beige; font-size: 20px;">Tipo de suscripción:</label>
    <br>
    <input type="radio" name="suscripcion" value="Diario"><label style="color: rgb(240, 240, 55);">Diario</label>
    <br>
     <input type="radio" name="suscripcion" value="Mensual"><label style="color: rgb(237, 237, 37);">Mensual</label>
     <br>
     <input type="radio" name="suscripcion" value="Anual"><label style="color: rgb(234, 234, 36);">Anual</label>
    <br>
    <label style="color: beige; font-size: 20px;">Descripción</label>
    <br>
    <textarea placeholder="Escribe una breve descripción..." style="width: 75%; height: 80px; margin: 30px; color: black;background-color: aquamarine;"></textarea>
    <br>
    <input type="submit" style="background-color: rgb(4, 135, 39); width: 80%; margin: auto;display: block; text-align: center; padding: 18px; font-size: large;" value="Enviar">








    
</form>    
</body>
</html>
